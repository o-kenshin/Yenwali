# Supabase CLI の設定（`supabase start` でローカルに起動する）
# 書いていない項目は CLI の既定値が使われる。
project_id = "yenwali"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[realtime]
# Broadcast（更新の通知）に使う
enabled = true

[studio]
enabled = true
port = 54323

[auth]
# ログイン機能は使わない
enabled = false

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[inbucket]
enabled = false
